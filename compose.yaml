services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "jobtracker", "-d", "jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
