services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "jobtracker", "-d", "jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app itself, built from the Dockerfile. It only starts when asked for:
  #   docker compose --profile app up --build
  app:
    profiles: [app]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobtracker
      SPRING_DATASOURCE_USERNAME: jobtracker
      SPRING_DATASOURCE_PASSWORD: jobtracker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
